[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchloop"
version = "0.1.0"
description = "Multi-agent system that fixes bugs in Python projects on a local LLM"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "litellm",
    "typer",
    "rich",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
patchloop = "patchloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
